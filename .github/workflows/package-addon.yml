name: Prepare CurseForge upload ZIP

on:
  push:
    branches: [main]
    paths:
      - 'ForgeAFK/**'
      - '.github/workflows/package-addon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package contents
        run: |
          set -euo pipefail
          for f in ForgeAFK/ForgeAFK.toc ForgeAFK/ForgeAFK_Forever.toc ForgeAFK/Core.lua ForgeAFK/UI.lua ForgeAFK/Minimap.lua; do
            test -s "$f"
          done
          grep -q '## Version: 1.0.0' ForgeAFK/ForgeAFK.toc
      - name: Create CurseForge package
        run: |
          set -euo pipefail
          zip -9 -r FORGE_AFK_Dad_Mode_1.0.0.zip ForgeAFK \
            -x '*/.DS_Store' '*__MACOSX*'
          unzip -t FORGE_AFK_Dad_Mode_1.0.0.zip
          unzip -Z1 FORGE_AFK_Dad_Mode_1.0.0.zip
      - name: Save upload ZIP as maintainer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE_AFK_Dad_Mode_1.0.0_CurseForge_upload
          path: FORGE_AFK_Dad_Mode_1.0.0.zip
          retention-days: 7
          if-no-files-found: error
