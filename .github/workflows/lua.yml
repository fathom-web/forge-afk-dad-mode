name: Forge AFK Lua checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate Lua syntax
        run: |
          luac5.1 -p ForgeAFK/Core.lua
          luac5.1 -p ForgeAFK/UI.lua
          luac5.1 -p ForgeAFK/Minimap.lua
          luac5.1 -p tests/smoke.lua
      - name: Run headless Dad Mode smoke tests
        run: lua5.1 tests/smoke.lua
